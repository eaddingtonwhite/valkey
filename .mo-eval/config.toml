language = "c"
repo = "valkey-io/valkey"          # mined against upstream; this checkout may be a fork

# The toolchain an agent and a scorer run in. Pinned by digest because a mutable tag is refused: the
# image is what a scorer re-runs months later. Published by momentohq/mfunc-llm-gw; nothing official
# ships GoogleTest, which is why this exists at all.
#
# This digest carries ccache (momentohq/mfunc-llm-gw#4570), which the C contract seeds for the
# baseline and scorer workers — the grading compiles run on every cell. Re-pinning changes the
# environment previously graded tasks are re-scored in, which is what a digest pin is for.
worker_image = "public.ecr.aws/e5j4o1h7/mo-eval-worker-c-gtest@sha256:27dfe36a8a232f124db0aeeae52c6a2058d9c1626597c75478a4b03e27e7b788"

# Build the GoogleTest binary, then run it with whatever filter the probe appends.
#
# One `sh -c` rather than a script in the tree: a workspace is an export of the candidate's PARENT
# commit, and nothing overlays `.mo-eval/` into it, so a script committed on HEAD is simply absent.
#
# The build belongs here and not in `setup_command`: an additive change's start state is a tree that
# does not compile, and a build done in setup reports that as an environment that could not be
# prepared rather than as the task failing.
#
# `-j` from the worker's own quota, never `$(nproc)`. `--cpus` is a CFS bandwidth limit rather than a
# visible core count, so `nproc` inside a worker reports the HOST's cores: on a 16-core lane that
# fanned sixteen `cc1plus` processes into a 4 GiB cgroup and the kernel reaped four of them,
# `g++: fatal error: Killed signal terminated program cc1plus`. valkey's gtest translation units
# compile under -Werror -Wpedantic -Wextra and are individually heavy.
#
# Every graded worker is told its quota in `MO_EVAL_WORKER_CPUS`, so this follows a lane resize with
# no edit here — the prod lane moved from 2 CPUs to 4 on 2026-09-24 and this command picked it up.
#
# DOUBLED, per momentohq/mfunc-llm-gw#4714: linking and I/O leave the quota idle, so ~2x the quota
# beats matching it. That issue measured the optimum at `--cpus 2` and asked for it to be confirmed
# at a larger worker before being treated as exact, so it was — in THIS image, under a real
# `--cpus 4 --memory 8g` cgroup, cold with ccache disabled:
#
#   -j4   peak 1515 MiB      -j8   peak 2423 MiB      -j16  peak 4728 MiB   (limit 8192)
#
# About 300 MiB per compiler, not the ~1 GiB estimated from the old 4 GiB worker, so -j8 sits at 30%
# of the limit. It also explains the original `Killed signal terminated program cc1plus`: that was
# -j16 against 4 GiB, which these numbers put at 4728 MiB — over that cgroup, well inside this one.
#
# The `:-2` is load-bearing, not defensive. A bare `-j` is UNLIMITED parallelism, and this same
# command also runs where nothing sets the variable — the service runner's probes, which use the
# runner's own environment. Unlimited `cc1plus` there is the very OOM the paragraph above describes.
#
# SINGLE quotes around the script. The generated scorer pastes this command into a bash script
# verbatim, so double quotes would let THAT shell expand `${MO_EVAL_WORKER_CPUS:-2}` and `"$@"`
# before `sh` ever sees them. Inside single quotes both reach the inner shell, where `"$@"` is the
# filter the probe appended and `mo-eval` is its `$0`.
test_command = "sh -c 'set -e; make -C src/unit valkey-unit-gtests -j\"$(( ${MO_EVAL_WORKER_CPUS:-2} * 2 ))\"; exec ./src/unit/valkey-unit-gtests \"$@\"' mo-eval"
