name: mo-eval suite
on:
  workflow_dispatch:
    inputs:
      arms:
        description: Models to evaluate, space-separated ("none" = build the suite only)
        default: "none"
      harnesses:
        description: Coding-agent harnesses, space-separated (mo, cc, pi, strands)
        default: "mo"
      candidates:
        description: >-
          How many candidates to request source for. The Action defaults to 12, which is too few
          here: most of valkey's merged pull requests test through the Tcl suite, which the `c`
          contract cannot grade, so they are rejected as writing no test and eat the budget. At 12,
          9 were spent that way and one order survived.
        default: "40"
      history:
        description: How many recently merged pull requests to offer as candidates
        default: "300"
permissions:
  contents: read
  pull-requests: read
  id-token: write   # the job authenticates to mo-eval as this repository; no secret to manage
jobs:
  suite:
    runs-on: ubuntu-latest
    steps:
      # Pinned by commit, not by tag. This job holds `id-token: write`, so whatever runs in it can
      # mint this repository's identity, and a moved major tag changes that code with no diff here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # The token goes away with the step that used it. `checkout` otherwise leaves it in
          # `.git/config` as an auth header, and this job runs the repository's OWN historical
          # tests — code from before anyone reviewed it for this purpose, as the same user, in the
          # same workspace.
          persist-credentials: false

      # The C toolchain, on the HOST. The worker image carries it too, but probes are run natively
      # by the runner — only scoring happens in the image — so a host without gtest fails every
      # probe at the build step inside the declared test command. `build-essential` is already on
      # the ubuntu runner; gtest and gmock are not, and no official image ships them, which is why
      # `worker_image` points at one we publish.
      - name: C/GoogleTest toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libgtest-dev libgmock-dev
          pkg-config --modversion gtest gmock

      - uses: momentohq/mo-eval-action@d21b901efe7a5b6a02b0c3c84987b181a06a428c # v1.6.1
        with:
          arms: ${{ inputs.arms }}
          harnesses: ${{ inputs.harnesses }}
          candidates: ${{ inputs.candidates }}
          history: ${{ inputs.history }}
